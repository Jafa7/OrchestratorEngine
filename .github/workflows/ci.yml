name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portable-core:
    name: Portable core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install .
      - name: Exercise installed read-only CLI
        run: |
          python -m orchestrator_engine.cli --version
          python -m orchestrator_engine.cli runtime-capabilities
          python -m orchestrator_engine.cli schemas binding
          python -m orchestrator_engine.cli host-capabilities
      - name: Run installed portable conformance
        run: python -m orchestrator_engine.cli conformance run --mode portable
      - name: Verify portable core and platform report
        run: python tools/check_portable_core.py --expect-detached supported

  macos-runtime:
    name: macOS runtime (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            python: "3.11"
          - os: macos-15
            python: "3.12"
          - os: macos-15
            python: "3.13"
          - os: macos-15-intel
            python: "3.11"
          - os: macos-15-intel
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build candidate wheel
        run: python -m pip wheel . --no-deps --wheel-dir native-dist
      - name: Install candidate wheel and test dependency
        run: |
          python -m pip install 'jsonschema[format]>=4.18,<5'
          python -m pip install native-dist/*.whl
      - name: Verify native lifecycle and process identity
        run: python -m unittest discover -s tests -p 'test_native_runtime.py'
      - name: Verify native resource coordination
        run: python -m unittest discover -s tests -p 'test_resource_queue.py'
      - name: Verify installed worker and recovery contracts
        run: python -m orchestrator_engine.cli conformance run --mode full --timeout-seconds 15
      - name: Run bounded native acceptance and reliability soak
        shell: bash
        run: |
          expected_machine="arm64"
          if [[ "${{ matrix.os }}" == *-intel ]]; then
            expected_machine="x86_64"
          fi
          env -u PYTHONPATH python tools/run_native_acceptance.py \
            --cli "$(command -v orchestrator-engine)" \
            --iterations 5 --timeout-seconds 15 \
            --expected-system Darwin \
            --expected-machine "${expected_machine}" \
            --output native-acceptance.json
      - name: Retain privacy-safe native acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-acceptance-${{ matrix.os }}-py${{ matrix.python }}
          path: native-acceptance.json
          if-no-files-found: warn
          retention-days: 30

  windows-runtime:
    name: Windows runtime (Python ${{ matrix.python }})
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build candidate wheel and create native environment
        run: |
          python -m pip wheel . --no-deps --wheel-dir native-dist
          python -m venv .native-venv
          .native-venv/Scripts/python -m pip install 'jsonschema[format]>=4.18,<5'
          $wheel = (Get-ChildItem native-dist -Filter *.whl | Select-Object -First 1).FullName
          .native-venv/Scripts/python -m pip install $wheel
      - name: Verify native lifecycle and crash containment
        run: .native-venv/Scripts/python -m unittest discover -s tests -p 'test_native_runtime.py'
      - name: Verify native resource coordination
        run: .native-venv/Scripts/python -m unittest discover -s tests -p 'test_resource_queue.py'
      - name: Verify installed worker and recovery contracts
        run: .native-venv/Scripts/python -m orchestrator_engine.cli conformance run --mode full --timeout-seconds 15
      - name: Run bounded native acceptance and reliability soak
        run: |
          $env:PYTHONPATH = $null
          .native-venv/Scripts/python tools/run_native_acceptance.py `
            --cli .native-venv/Scripts/orchestrator-engine.exe `
            --iterations 5 --timeout-seconds 15 `
            --expected-system Windows --expected-machine x86_64 `
            --output native-acceptance.json
      - name: Retain privacy-safe native acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-acceptance-windows-2022-py${{ matrix.python }}
          path: native-acceptance.json
          if-no-files-found: warn
          retention-days: 30

  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install '.[test]'
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

  quality:
    name: Lint, build, and wheel smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build and test tools
        run: python -m pip install --upgrade build ruff '.[test]'
      - name: Check whitespace and diff cleanliness
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Check release metadata consistency
        run: python tools/check_release_consistency.py
      - name: Lint
        run: ruff check .
      - name: Build distribution
        run: python -m build
      - name: Check distribution content and release bundle
        shell: bash
        run: |
          version="$(python tools/check_release_consistency.py --print-version)"
          python tools/prepare_release_bundle.py --tag "v${version}" --dist-dir dist --output-dir .release-bundle
      - name: Smoke test the wheel without PYTHONPATH
        shell: bash
        run: |
          expected_version="$(python tools/check_release_consistency.py --print-version)"
          python -m venv .wheel-smoke
          env -u PYTHONPATH .wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          env -u PYTHONPATH .wheel-smoke/bin/orchestrator-engine --version | grep -Fx "orchestrator-engine ${expected_version}"
          env -u PYTHONPATH .wheel-smoke/bin/orchestrator-engine conformance run --mode full --timeout-seconds 15
      - name: Run bounded installed-wheel reliability soak
        shell: bash
        run: |
          env -u PYTHONPATH python tools/run_reliability_soak.py \
            --cli .wheel-smoke/bin/orchestrator-engine \
            --iterations 20 --mode full --timeout-seconds 15

  upgrade-compatibility:
    name: Upgrade compatibility (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "0.10.0"
            wheel: orchestrator_engine-0.10.0-py3-none-any.whl
            sha256: 7b4939cf9a7382b6707d325271fc987b55891b651ba8a3e29f3aa10617bc3618
          - version: "0.11.1"
            wheel: orchestrator_engine-0.11.1-py3-none-any.whl
            sha256: 2e4f9d05a02095619b37f75fb7439eef9bffc40baab10c1336868dd357184e29
          - version: "0.12.0"
            wheel: orchestrator_engine-0.12.0-py3-none-any.whl
            sha256: 0bdeb4b976e20e8e608b8fe5a4c0fce4e38c4071034c9adb99151f4f40870d03
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build current wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
      - name: Install pinned baseline and current wheels
        env:
          BASELINE_VERSION: ${{ matrix.version }}
          BASELINE_WHEEL: ${{ matrix.wheel }}
          BASELINE_SHA256: ${{ matrix.sha256 }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .upgrade
          python - <<'PY'
          import os
          import pathlib
          import time
          import urllib.request

          target = pathlib.Path(".upgrade") / os.environ["BASELINE_WHEEL"]
          url = (
              f"https://github.com/{os.environ['REPOSITORY']}/releases/download/"
              f"v{os.environ['BASELINE_VERSION']}/{os.environ['BASELINE_WHEEL']}"
          )
          for attempt in range(1, 4):
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      target.write_bytes(response.read())
                  break
              except OSError:
                  if attempt == 3:
                      raise
                  time.sleep(attempt * 2)
          PY
          python -c 'import hashlib, os, pathlib; p=pathlib.Path(".upgrade") / os.environ["BASELINE_WHEEL"]; actual=hashlib.sha256(p.read_bytes()).hexdigest(); expected=os.environ["BASELINE_SHA256"]; assert actual == expected, (actual, expected)'
          python -m venv .upgrade-baseline
          python -m venv .upgrade-current
          .upgrade-baseline/bin/python -m pip install --no-deps \
            ".upgrade/${BASELINE_WHEEL}"
          .upgrade-current/bin/python -m pip install --no-deps dist/*.whl
      - name: Verify historical state upgrade
        run: |
          env -u PYTHONPATH python tools/verify_upgrade_path.py \
            --baseline-cli .upgrade-baseline/bin/orchestrator-engine \
            --current-cli .upgrade-current/bin/orchestrator-engine
